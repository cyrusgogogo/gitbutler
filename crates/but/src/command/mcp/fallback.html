<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitButler</title>
<style>
body { margin: 16px; font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; color-scheme: light dark; }
header { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
select { font: inherit; max-width: 100%; }
h1 { font-size: 18px; }
</style>
</head>
<body>
<header>
  <label id="language-label" for="language"></label>
  <select id="language">
    <option value="system"></option>
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
  </select>
</header>
<main>
  <h1 id="title"></h1>
  <p id="message"></p>
  <p id="notice" role="status" hidden></p>
</main>
