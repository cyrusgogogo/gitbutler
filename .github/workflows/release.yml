name: Release Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.${{ github.run_number }}
  CHANNEL: release

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      GITBUTLER_REQUIRE_MCP_APP: "1"
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: never
      OS: windows
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/init-env-node

      - name: Initialize Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-local-release

      - name: Set Perl path for native dependencies
        run: |
          $perlPath = (Get-Command perl.exe -ErrorAction Stop).Source
          "PERL=$perlPath" >> $env:GITHUB_ENV
          "OPENSSL_SRC_PERL=$perlPath" >> $env:GITHUB_ENV

      - name: Test release preparation and publication rules
        run: node --test scripts/github-release.test.mjs

      - name: Prepare automatic version
        run: node scripts/github-release.mjs prepare

      - name: Build MCP apps and shared packages
        run: pnpm exec turbo run build --filter=@gitbutler/but-mcp-app

      - name: Check translation catalogs
        run: pnpm -F @gitbutler/i18n check

      - name: Build native SDK used by Lite
        run: pnpm -F @gitbutler/but-sdk build:napi:release

      - name: Generate complete SDK types
        run: cargo run --release --locked -p but-ts -- --output packages/but-sdk/src/generated/linear/index.d.ts

      - name: Build Desktop frontend
        run: pnpm build:desktop -- --mode production

      - name: Package unsigned Desktop MSI
        run: pnpm tauri-for-release build --ci --no-sign --features windows --bundles msi --config target/github-release/tauri.conf.json

      - name: Copy CLI into Lite
        run: |
          New-Item -ItemType Directory -Force apps/lite/resources/bin | Out-Null
          Copy-Item -LiteralPath target/release/but.exe -Destination apps/lite/resources/bin/but.exe

      - name: Build Lite and prepare Git askpass
        run: |
          pnpm build:lite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -F @gitbutler/lite prepare-askpass

      - name: Package unsigned Lite portable executable
        working-directory: apps/lite
        run: pnpm exec electron-builder --win portable --x64 --publish never --config.artifactName='GitButler-Lite-${version}-windows-${arch}.${ext}'

      - name: Collect both packages and SHA-256 checksums
        run: node scripts/github-release.mjs collect

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: release/github/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release/github/

      - name: Publish complete release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { publishWindowsRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`);
            const result = await publishWindowsRelease(github, {
              ...context.repo,
              sha: context.sha,
              version: process.env.VERSION,
              directory: `${process.env.GITHUB_WORKSPACE}/release/github`,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (result.published) {
              await core.summary.addLink('下载 Windows 版本', result.url).write();
            } else {
              core.notice('master 已有更新提交，本次构建不再发布。');
            }
